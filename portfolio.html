  <script src="assets/fallback.js"></script>

  <script>
    initChrome();
    const view = $('#view');
    const id = new URLSearchParams(location.search).get('id');

    function setMeta(title, desc) {
      document.title = title;
      const m = document.querySelector('meta[name="description"]'); if (m) m.setAttribute('content', desc);
      const ot = document.querySelector('meta[property="og:title"]'); if (ot) ot.setAttribute('content', title);
      const od = document.querySelector('meta[property="og:description"]'); if (od) od.setAttribute('content', desc);
    }
    function setCanonical(url) {
      let l = document.querySelector('link[rel="canonical"]');
      if (!l) { l = document.createElement('link'); l.rel = 'canonical'; document.head.appendChild(l); }
      l.href = url;
      const o = document.querySelector('meta[property="og:url"]'); if (o) o.setAttribute('content', url);
    }
    const abs = s => new URL(s, 'https://oddfuse.hu/').href;

    /* ===== Lista nézet (nincs ?id) ===== */
    function renderList(projects) {
      setCanonical('https://oddfuse.hu/portfolio.html');
      setMeta('Portfólió – ODDFUSE | Digitális formák, valós tárgyak', 'ODDFUSE portfólió: tabletop miniatűrök, praktikus tartók, pótalkatrészek, háziállat szobrok és személyre szabott FDM nyomtatott tárgyak.');
      view.innerHTML = `
        <a href="index.html#portfolio" class="inline-flex items-center gap-2 text-sm text-muted hover:text-accent transition"><span aria-hidden="true">←</span> Vissza a főoldalra</a>
        <div class="mt-6 max-w-3xl">
          <p class="text-accent text-sm font-medium tracking-widest uppercase">Portfólió</p>
          <h1 class="mt-3 font-display text-4xl sm:text-5xl font-bold tracking-tight">Elkészült munkák</h1>
          <p class="mt-4 text-muted font-light leading-relaxed">Válassz egy munkát, és nézd meg részletesen: mire szolgál, milyen problémát old meg, miből és hogyan készült.</p>
        </div>
        <div class="mt-12 grid grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-5">${projects.map(projectCard).join('')}</div>`;
    }

    /* ===== Részletes nézet (?id=...) ===== */
    function infoBlock(title, text, icon) {
      if (!text || !String(text).trim()) return '';
      return `
        <div class="glass rounded-2xl p-6">
          <div class="h-10 w-10 rounded-xl bg-accent/10 text-accent grid place-items-center">${icon}</div>
          <h2 class="mt-4 font-display text-lg font-semibold">${esc(title)}</h2>
          <p class="mt-2 text-sm text-muted leading-relaxed">${esc(text)}</p>
        </div>`;
    }
    const I = {
      goal: '<svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>',
      fix: '<svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4 2.6-2.6Z"/></svg>',
      mat: '<svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg>',
      tech: '<svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>'
    };

    function renderProject(p, all) {
      setMeta(`${p.title} – ODDFUSE portfólió`, p.summary);
      setCanonical(abs('portfolio.html?id=' + encodeURIComponent(p.id)));
      const fitCls = p.imageFit === 'contain' ? 'object-contain' : 'object-cover';
      const infoList = [['Mire szolgál?', p.purpose, I.goal], ['Milyen problémát oldott meg?', p.problem, I.fix], ['Nyomtatási részletek', p.printing, I.tech]]
        .filter(b => b[1] && String(b[1]).trim());
      const infoCols = infoList.length >= 3 ? 'md:grid-cols-3' : infoList.length === 2 ? 'md:grid-cols-2' : 'md:grid-cols-1';
      const items = (p.images && p.images.length)
        ? p.images.map(src => ({ src }))
        : [0, 1, 2].map(v => ({ art: v }));
      const hasPhotos = !!(p.images && p.images.length);
      const tile = (it, cls) => it.src
        ? `<img src="${esc(it.src)}" alt="${esc(p.title)}" class="${cls}" onerror="this.remove()" />`
        : `<div class="art-wrap h-full w-full">${layerArt(p.profile ?? 0, it.art, 'meet')}</div>`;

      const idx = all.findIndex(x => x.id === p.id);
      const prev = all[(idx - 1 + all.length) % all.length], next = all[(idx + 1) % all.length];

      view.innerHTML = `
        <nav class="flex flex-wrap items-center gap-x-3 gap-y-1 text-sm text-muted" aria-label="Morzsamenü">
          <a href="index.html#portfolio" class="hover:text-accent transition">← Főoldal</a><span aria-hidden="true">/</span>
          <a href="portfolio.html" class="hover:text-accent transition">Portfólió</a><span aria-hidden="true">/</span>
          <span class="text-bone/80">${esc(p.title)}</span>
        </nav>

        <div class="mt-8 grid gap-10 lg:grid-cols-5">
          <div class="lg:col-span-3">
            <div id="mainShot" class="img-wrap glass relative aspect-[4/3] overflow-hidden rounded-2xl">${tile(items[0], 'h-full w-full ' + fitCls)}</div>
            ${items.length > 1 ? `<div class="mt-3 grid grid-cols-4 sm:grid-cols-5 gap-3" id="thumbs">${items.map((it, i) => `
              <button type="button" data-i="${i}" class="img-wrap glass aspect-[4/3] overflow-hidden rounded-xl transition hover:border-accent/60 ${i === 0 ? 'border-accent/70' : ''}" aria-label="${i + 1}. kép megtekintése">${tile(it, 'h-full w-full ' + fitCls)}</button>`).join('')}</div>` : ''}
            ${hasPhotos ? '' : '<p class="mt-3 text-xs text-muted">A projekt saját fotói hamarosan kerülnek fel. Az illusztráció a nyomtatott rétegeket idézi.</p>'}
          </div>

          <div class="lg:col-span-2">
            <span class="text-xs uppercase tracking-widest text-accent">${esc(p.category)}</span>
            <h1 class="mt-3 font-display text-3xl sm:text-4xl font-bold tracking-tight leading-tight">${esc(p.title)}</h1>
            <p class="mt-4 text-muted font-light leading-relaxed">${esc(p.summary)}</p>
            <div class="mt-6 glass rounded-2xl p-5">
              <p class="text-xs uppercase tracking-widest text-muted">Anyag</p>
              <p class="mt-1 font-display text-lg font-semibold">${esc(p.material)}</p>
            </div>
            <div class="mt-6 flex flex-wrap gap-3">
              <a href="index.html#kapcsolat" class="glow inline-flex items-center gap-2 rounded-2xl bg-accent px-6 py-3 font-semibold text-ink transition hover:brightness-110">Hasonlót szeretnék <span aria-hidden="true">→</span></a>
              <a href="portfolio.html" class="glass rounded-2xl px-6 py-3 font-medium hover:border-accent/40 hover:text-accent transition">Összes munka</a>
            </div>
          </div>
        </div>

        ${infoList.length ? `<div class="mt-12 grid gap-5 ${infoCols}">${infoList.map(b => infoBlock(b[0], b[1], b[2])).join('')}</div>` : ''}

        <div class="mt-12 flex flex-wrap items-center justify-between gap-4 border-t border-bone/10 pt-6 text-sm">
          <a href="portfolio.html?id=${encodeURIComponent(prev.id)}" class="text-muted hover:text-accent transition">← ${esc(prev.title)}</a>
          <a href="portfolio.html?id=${encodeURIComponent(next.id)}" class="text-muted hover:text-accent transition">${esc(next.title)} →</a>
        </div>`;

      const thumbs = $('#thumbs');
      if (thumbs) thumbs.querySelectorAll('button').forEach(b => b.onclick = () => {
        $('#mainShot').innerHTML = tile(items[+b.dataset.i], 'h-full w-full ' + fitCls);
        thumbs.querySelectorAll('button').forEach(x => x.classList.remove('border-accent/70'));
        b.classList.add('border-accent/70');
      });

      /* Projekt strukturált adat (AI / keresők) */
      const ld = document.createElement('script');
      ld.type = 'application/ld+json';
      ld.textContent = JSON.stringify({
        '@context': 'https://schema.org', '@type': 'CreativeWork',
        url: abs('portfolio.html?id=' + encodeURIComponent(p.id)),
        name: p.title, description: p.summary, genre: p.category, material: p.material,
        creator: { '@type': 'ProfessionalService', '@id': 'https://oddfuse.hu/#business', name: 'ODDFUSE' },
        ...(hasPhotos ? { image: p.images.map(abs) } : {})
      });
      document.head.appendChild(ld);
    }

    function renderMissing() {
      setMeta('A projekt nem található – ODDFUSE', 'A keresett portfólió projekt nem található.');
      const rb = document.querySelector('meta[name="robots"]'); if (rb) rb.setAttribute('content', 'noindex');
      view.innerHTML = `
        <div class="glass rounded-2xl p-10 text-center max-w-xl mx-auto">
          <h1 class="font-display text-2xl font-bold">A projekt nem található</h1>
          <p class="mt-3 text-muted">Lehet, hogy a link elavult. Nézd meg az összes munkát.</p>
          <a href="portfolio.html" class="mt-6 inline-flex rounded-2xl bg-accent px-6 py-3 font-semibold text-ink hover:brightness-110 transition">Összes munka</a>
        </div>`;
    }

    loadData('portfolio').then(d => {
      const all = d.projects || [];
      if (!id) renderList(all);
      else {
        const p = all.find(x => x.id === id);
        p ? renderProject(p, all) : renderMissing();
      }
      observeReveals();
      window.scrollTo(0, 0);
    }).catch(() => {
      view.innerHTML = '<p class="text-muted">A portfólió jelenleg nem tölthető be. <a class="text-accent underline" href="index.html">Vissza a főoldalra</a></p>';
    });
  </script>
</body>
